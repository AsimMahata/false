name: CI & Branch Merge Verification

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'feature-*'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Run Backend & Crypto Tests
        run: npm test

      - name: Build Frontend Application
        run: npm run build
